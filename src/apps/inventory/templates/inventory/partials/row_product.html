<tr class="hover:bg-gray-50 dark:hover:bg-neutral-800/60">
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800 font-semibold">{{ produto.description }}</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800 font-mono">{{ produto.barcode }}</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800">{{ produto.brand|default:"-" }}</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800 font-mono">{{ produto.quantity }}</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800 font-mono">-</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800 font-mono">R$ {{ produto.price }}</td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800">
    <span class="inline-block text-[11.5px] font-semibold px-2.5 py-1 rounded {{ produto.status_css }}">{{ produto.status_label }}</span>
  </td>
  <td class="py-3 px-3.5 border-b border-gray-200 dark:border-neutral-800">
    <div class="flex gap-1.5 justify-end">
      <button class="w-7 h-7 flex items-center justify-center border border-gray-200 dark:border-neutral-700 rounded-md bg-transparent text-gray-500 dark:text-neutral-400 hover:border-blue-700 hover:text-blue-700 transition-colors" title="Editar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="w-7 h-7 flex items-center justify-center border border-gray-200 dark:border-neutral-700 rounded-md bg-transparent text-gray-500 dark:text-neutral-400 hover:border-red-600 hover:text-red-600 transition-colors" title="Deletar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </div>
  </td>
</tr>
